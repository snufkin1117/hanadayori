<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花だより</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#F5F9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="花だより">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F9EE;--ink:#33402e;--sub:#7d8a76;--main:#5BA65B;--main2:#8CC46A;--sun:#F6B93B;--pink:#F08BA8;--line:#E3EBD8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:460px;margin:0 auto;padding:14px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{font-size:19px;margin:0;font-weight:800}
header .sub{font-size:11px;color:var(--sub)}
.role{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
.role button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);padding:6px 10px;border-radius:99px;cursor:pointer}
.role button.on{background:var(--main);color:#fff}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.sec{font-size:15px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.small{font-size:12px;color:var(--sub);line-height:1.7}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
.st-done{background:#E8F4E4;color:#3E8A3E}.st-plan{background:#FFF2D6;color:#B07A00}.st-conf{background:#E3F0FF;color:#2F6FB5}.st-tent{background:#F1F1F1;color:#888}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-family:inherit;font-size:16px;font-weight:800;color:#fff;background:var(--main);box-shadow:0 4px 0 #43874A;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #43874A}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line);font-size:14px;padding:11px}
.btn.sm{display:inline-block;width:auto;font-size:13px;padding:8px 12px;border-radius:12px}
.next{position:relative;overflow:hidden}
.next .big{font-size:44px;line-height:1}
.next h2{font-size:20px;margin:6px 0 2px}
.cand{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.cand:last-child{border:none}
.cand .d{flex:1;font-weight:700;font-size:15px}
.ox{display:flex;gap:6px}
.ox button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:#b5bfae;cursor:pointer;font-family:inherit}
.ox button.on.o{background:#5BA65B;border-color:#5BA65B;color:#fff}
.ox button.on.t{background:#F6B93B;border-color:#F6B93B;color:#fff}
.ox button.on.x{background:#c9cfc4;border-color:#c9cfc4;color:#fff}
.tally{font-size:12px;color:var(--sub);width:44px;text-align:right}
.garden{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:linear-gradient(#C9A27A,#A87E55);border-radius:16px;padding:10px 8px;position:relative}
.garden span{aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;font-size:20px;line-height:1}
.garden span.empty:after{content:"・";color:#8a6542;font-size:14px}
.garden span.new{animation:grow .9s ease}
@keyframes grow{0%{transform:scale(0) translateY(10px)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.journey{display:flex;justify-content:space-between;position:relative;margin-top:6px}
.journey:before{content:"";position:absolute;left:14px;right:14px;top:18px;height:3px;background:var(--line);z-index:0}
.jn{position:relative;z-index:1;text-align:center;width:44px;cursor:pointer}
.jn .ic{width:38px;height:38px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:19px;background:#fff;border:3px solid var(--line)}
.jn.done .ic{border-color:var(--main2);background:#F0F8EA}
.jn.now .ic{border-color:var(--sun);background:#FFF6E0;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(246,185,59,.25)}}
.jn .m{font-size:10px;color:var(--sub);margin-top:3px}
.yr{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.yr:last-child{border:none}
.yr .mo{width:42px;text-align:center;font-weight:800;color:var(--main);font-size:15px;flex:none}
.yr .mo small{display:block;font-size:10px;color:var(--sub);font-weight:400}
.yr .ic{font-size:26px;flex:none}
.yr .bd{flex:1}
.yr .bd b{display:block;font-size:14px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.ph.add{border:2px dashed var(--line);background:#fafcf7;font-size:24px;color:var(--sub);cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{display:flex;max-width:460px;width:100%}
.nav button{flex:1;border:none;background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);padding:8px 0 10px;cursor:pointer}
.nav button .ic{display:block;font-size:22px}
.nav button.on{color:var(--main)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(40,50,35,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.close{float:right;border:none;background:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:11px;color:var(--sub)}
td.nm{text-align:left}
.duty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dy{border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer;font-family:inherit}
.dy b{display:block;font-size:14px}
.dy .who{font-size:11px;color:var(--sub);min-height:16px}
.dy.full{border-color:#9FD0F0;background:#EEF7FD}
.dy.me{border-color:var(--main);background:#EEF8EA}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;font-family:inherit;font-size:13px;line-height:1.6;resize:vertical;background:#fff}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);background:#fff;border-radius:24px;padding:20px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:all .3s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .big{font-size:46px}.toast .m{font-weight:800;margin-top:4px}
.tip{background:#FFF8E6;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.7;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pm{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:800;color:var(--main);cursor:pointer;font-family:inherit;line-height:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🌼 花だより</h1><div class="sub">日の里西小 栽培ボランティア <span style="background:#33402e;color:#fff;border-radius:99px;padding:1px 8px;font-size:10px">β版</span></div></div>
    <div class="role"><button data-r="member" class="on">メンバー</button><button data-r="leader">代表</button></div>
  </header>
  <div class="tip" style="margin:0 0 12px">🧪 お試し用のβ版です。記録や写真はこのスマホの中だけに保存され、ほかの人には届きません。右上で「メンバー」と「代表」の画面を切り替えて、自由に触ってみてください。</div>
  <main id="main"></main>
</div>
<nav class="nav"><div>
  <button data-v="home" class="on"><span class="ic">🏡</span>ホーム</button>
  <button data-v="year"><span class="ic">📅</span>年間</button>
  <button data-v="album"><span class="ic">📷</span>アルバム</button>
</div></nav>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><div class="big" id="tIc"></div><div class="m" id="tM"></div></div>
<input type="file" id="file" accept="image/*" multiple class="hidden">

<script>
/* ===== サンプルデータ（2026年度） ===== */
const ME="あなた";
const MEMBERS=["あなた","佐藤さん","田中さん","山本さん","中村さん","小林さん","加藤さん","吉田さん"];
const FLOWERS={"花の植え替え":"🌷","サツマイモ":"🍠","草むしり":"🌿","水やり":"💧","お手入れ":"🌸","菜の花":"🌼"};
const ACTS=[
 {id:"a1",icon:"🌷",name:"運動会前の花の植え替え",date:"2026-05-22",time:"9:00〜10:30",place:"体育館前の花壇・玄関前のプランター",desc:"運動会に向けて、春の花から夏の花へ植え替えます。",status:"done",att:7,thanks:"暑い中ありがとうございました！運動会で子どもたちが花の前で写真を撮っていました。"},
 {id:"a2",icon:"🍠",name:"サツマイモの苗植え",date:"2026-06-05",time:"9:00〜10:00",place:"学校菜園",desc:"2年生の生活科で使うサツマイモの苗を植えます。",status:"done",att:6,thanks:"秋の収穫が楽しみですね。ありがとうございました！"},
 {id:"a3",icon:"🌿",name:"二者面談前の草むしり",date:"2026-07-16",time:"8:30〜9:30",place:"体育館前の花壇・玄関前のプランター",desc:"面談で来校する保護者の皆さんを、きれいな花壇でお迎えします。",status:"done",att:8,thanks:"朝早くからありがとうございました。熱中症にならず何よりです。"},
 {id:"a4",icon:"💧",name:"学校閉庁日の花壇の水やり",date:"2026-08-08",end:"2026-08-16",time:"朝か夕方のご都合のよい時間",place:"体育館前の花壇・玄関前のプランター",desc:"先生方がいない閉庁日の間、交代で水やりをします。1日1人いれば十分です。",status:"done",att:9,duty:true,roster:{"08-08":["佐藤さん"],"08-09":["田中さん"],"08-10":["あなた"],"08-11":["山本さん"],"08-12":["中村さん","小林さん"],"08-13":["加藤さん"],"08-14":["吉田さん"],"08-15":["佐藤さん"],"08-16":["あなた"]},thanks:"お盆の時期にもかかわらず、9日間、1日も欠かさず水やりできました！"},
 {id:"a5",icon:"🪴",name:"子ども大学前の花の植え替え",date:"2026-10-29",time:"9:00〜10:30",place:"体育館前の花壇・玄関前のプランター",desc:"子ども大学に来る地域の皆さんを、秋の花でお迎えします。",status:"done",att:7,thanks:"ビオラがとても映えています。ありがとうございました！"},
 {id:"a6",icon:"🌸",name:"卒業式前の花壇のお手入れ",date:"2027-03-04",time:"9:00〜10:30",place:"体育館前の花壇・玄関前のプランター",desc:"卒業式に向けて、体育館前の花壇と玄関前のプランターのお手入れをします。",status:"tent",when:"3月上旬（卒業式の前）"},
 {id:"a7",icon:"🌼",name:"卒業式前日 菜の花の花道づくり",date:"2027-03-16",time:"14:00〜15:30",place:"体育館前〜正門",desc:"卒業式の前日に、卒業生が通る道を菜の花で飾る花道をつくります。日にちは卒業式で決まるので、日程調整はしません。",status:"tent",fixed:true,when:"卒業式の前日"}
];
const PH_BG=["linear-gradient(135deg,#FFE3EC,#FFC3D3)","linear-gradient(135deg,#E6F6DC,#BFE3A8)","linear-gradient(135deg,#FFF3C9,#FFD978)","linear-gradient(135deg,#DDF0FF,#B4DBF7)"];

let S={role:"member",view:"home",acts:ACTS,photos:{},planted:0,nextYear:null};
try{const v=JSON.parse(localStorage.getItem("hanadayori"));if(v&&v.v===7)S=Object.assign(S,v.s)}catch(e){}
function save(){try{localStorage.setItem("hanadayori",JSON.stringify({v:7,s:Object.assign({},S,{photos:{}})}))}catch(e){}}
const $=id=>document.getElementById(id);
const W=["日","月","火","水","木","金","土"];
const fd=(s,opt)=>{const d=new Date(s+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate()+(opt===false?"":"（"+W[d.getDay()]+"）")};
const md=s=>{const d=new Date(s+"T00:00:00");return d.getMonth()+1};
const nextAct=()=>S.acts.find(a=>a.status!=="done");
const when=a=>{if(a.when)return a.when;const d=new Date(a.date+"T00:00:00");return (d.getMonth()+1)+"月"+(d.getDate()<=10?"上旬":d.getDate()<=20?"中旬":"下旬")+"ごろ"};
const stChip=a=>a.status==="done"?'<span class="chip st-done">済</span>':a.status==="plan"?'<span class="chip st-plan">日程調整中</span>':a.status==="conf"?'<span class="chip st-conf">確定</span>':'<span class="chip st-tent">予告</span>';
function toast(i,m){$("tIc").textContent=i;$("tM").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1200)}
function totalAtt(){return S.acts.reduce((n,a)=>n+(a.att||0),0)+S.planted}

/* ===== ホーム ===== */
function home(){
  const a=nextAct();let h="";
  if(a){
    h+=`<div class="card next"><div class="row" style="justify-content:space-between;align-items:center"><span class="small">次の作業</span>${stChip(a)}</div>
      <div style="display:flex;gap:12px;align-items:center;margin-top:6px"><div class="big">${a.icon}</div><div><h2>${a.name}</h2><div class="small">${a.status==="conf"?fd(a.date)+" "+a.time:a.status==="plan"?"候補日："+a.cands.map(c=>fd(c,false)).join("・"):"時期："+when(a)}</div></div></div>`;
    if(a.status==="tent")h+=`<p style="font-size:14px;line-height:1.8;margin:12px 0 0">${a.desc}</p><div class="tip">🗓 日程は、決まり次第このアプリとLINEでお知らせします。</div>`;
    if(a.status==="plan"){
      h+=`<p class="sec" style="margin-top:14px">🗓 ご都合を教えてください</p>`;
      a.cands.forEach(c=>{const v=(a.votes[ME]||{})[c];const n=Object.values(a.votes).filter(x=>x[c]==="o").length;
        h+=`<div class="cand"><span class="d">${fd(c)}</span><span class="tally">○ ${n}人</span><span class="ox">${["o","t","x"].map(k=>`<button class="${k}${v===k?" on":""}" data-vote="${a.id}|${c}|${k}">${k==="o"?"○":k==="t"?"△":"×"}</button>`).join("")}</span></div>`});
      h+=`<p class="small" style="margin:8px 0 0">○を付けると、みんなの花壇に芽が出ます🌱</p>`;
    }
    if(a.status==="conf"&&isDay(a)){
      const done=(a.checkin||[]).includes(ME);
      h+=`<div class="tip" style="background:#EEF8EA;text-align:center;font-size:14px">🌷 <b>今日は作業日です！</b><br>参加した人は、花壇に花を植えましょう</div>
      <div style="margin-top:12px">${done?`<button class="btn ghost" data-checkin="${a.id}">✅ 花を植えました（取り消す）</button>`:`<button class="btn" style="font-size:18px;padding:18px" data-checkin="${a.id}">🌷 参加しました！花を植える</button>`}</div>
      <p class="small" style="text-align:center;margin:8px 0 0">今日植えられた花：${(a.checkin||[]).length}本</p>`;
    }
    else if(a.status==="conf"){
      const joined=(a.join||[]).includes(ME);const days=Math.ceil((new Date(a.date)-new Date(new Date().toDateString()))/864e5);
      h+=`<div class="tip">📍 ${a.place}<br>🧤 道具は学校にそろっています。手ぶらでどうぞ</div>
      <div style="margin-top:12px">${joined?`<button class="btn ghost" data-join="${a.id}">✅ 参加予定です（取り消す）</button>`:`<button class="btn" data-join="${a.id}">参加します！</button>`}</div>
      ${days>0?`<p class="small" style="text-align:center;margin:8px 0 0">作業日まで あと${days}日</p>`:""}`;
    }
    h+=`<div style="margin-top:12px"><button class="btn ghost" data-open="${a.id}">くわしく見る</button></div></div>`;
  }
  if(S.role==="leader"&&a)h+=leaderPanel(a);
  // みんなの花壇
  // 花＝確定した参加人数＋当日に植えた人数、芽＝参加予定（○や「参加します」）の人数
  const n=S.acts.reduce((k,x)=>k+(x.status==="done"?(x.att||0):(x.checkin||[]).length),0),sp=a?sprouts(a):0,cells=64;
  const kinds=["🌷","🌼","🌸","🌻","🌺","🌷","🌼","🪻"];
  const pick=i=>kinds[(i*7+Math.floor(i/3))%kinds.length];
  h+=`<div class="card"><p class="sec">🌼 今年度のみんなの花壇</p><div class="garden" id="garden">${Array.from({length:cells},(_,i)=>i<n?`<span class="${i===n-1&&S.justBloom?"new":""}">${pick(i)}</span>`:i<n+sp?`<span class="${i===n+sp-1&&S.justPlanted?"new":""}">🌱</span>`:'<span class="empty"></span>').join("")}</div>
    <p class="small" style="margin:8px 0 0">日程に○を付けたり参加を連絡したりすると芽が出て🌱、作業の日に「花を植える」を押すと花が咲きます。今年度は、のべ<b>${n}</b>人分の花が咲きました。</p></div>`;
  S.justPlanted=false;S.justBloom=false;
  // あゆみ
  h+=`<div class="card"><p class="sec">🌱 今年度のあゆみ</p><div class="journey">${S.acts.map(x=>`<div class="jn ${x.status==="done"?"done":x===a?"now":""}" data-open="${x.id}"><div class="ic">${x.status==="done"||x===a?x.icon:"・"}</div><div class="m">${md(x.date)}月</div></div>`).join("")}</div></div>`;
  return h;
}
function isDay(a){return a.dayMode||a.date<=new Date().toISOString().slice(0,10)}
function sprouts(a){
  if(a.status==="plan")return Object.values(a.votes).filter(v=>Object.values(v).includes("o")).length;
  if(a.status==="conf")return (a.join||[]).filter(m=>!(a.checkin||[]).includes(m)).length;
  return 0;
}
function tentLeader(a){
  return a.fixed?`<p class="small" style="margin-top:0">この作業は日にちが行事で決まるので、日程調整はしません。日にちがわかったら、そのまま告知してください。</p><button class="btn" data-setfixed="${a.id}">📌 日にちを決めて告知する</button>`
   :`<p class="small" style="margin-top:0">日程が決まっていないので、メンバーには作業の予告だけが表示されています。候補日を決めたら、日程調整を始めてください。</p><button class="btn" data-startplan="${a.id}">🗓 日程調整を始める</button>`;
}
function leaderPanel(a){
  let h=`<div class="card" style="border:2px solid #FFE3A3"><p class="sec">🧑‍🌾 代表のメニュー</p>`;
  if(a.status==="tent")h+=tentLeader(a)+`<div style="height:12px"></div>`;
  if(a.status==="plan"){
    h+=`<p class="small" style="margin-top:0">回答状況（${Object.keys(a.votes).length}/${MEMBERS.length}人）</p><table><tr><th></th>${a.cands.map(c=>`<th>${fd(c,false)}</th>`).join("")}</tr>`;
    MEMBERS.forEach(m=>{const v=a.votes[m]||{};h+=`<tr><td class="nm">${m}</td>${a.cands.map(c=>`<td>${v[c]==="o"?"○":v[c]==="t"?"△":v[c]==="x"?"×":"<span style='color:#ccc'>－</span>"}</td>`).join("")}</tr>`});
    h+=`<tr><td class="nm"><b>○の数</b></td>${a.cands.map(c=>`<td><b>${Object.values(a.votes).filter(x=>x[c]==="o").length}</b></td>`).join("")}</tr></table>
    <p class="small">この日に決める：</p><div class="row">${a.cands.map(c=>`<button class="btn sm" data-fix="${a.id}|${c}">${fd(c)}</button>`).join("")}</div>`;
  }
  if(a.status==="conf"&&!isDay(a))h+=`<button class="btn ghost" data-dayon="${a.id}">▶ 作業当日の画面を試す（試作版のみ）</button><p class="small" style="margin-top:6px">本番では、作業日になると自動で切り替わります。</p>`;
  if(a.status==="conf"&&isDay(a)){
    const ck=a.checkin||[],jn=a.join||[];
    h+=`<p class="small" style="margin-top:0">作業が終わったら、参加した人を確認して確定してください。ボタンを押し忘れた人にはチェックを入れ、来られなかった人は外します。</p><div id="attList">`+
      MEMBERS.map(m=>`<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px"><input type="checkbox" value="${m}" ${ck.includes(m)?"checked":""} style="width:20px;height:20px">${m}<span class="small" style="margin-left:auto">${ck.includes(m)?"🌷植えた":jn.includes(m)?"参加予定":""}</span></label>`).join("")+
      `</div><div style="height:12px"></div><button class="btn" data-attfix="${a.id}">参加を確定する</button><div style="height:12px"></div>`;
  }
  h+=`<p class="small" style="margin-bottom:6px">グループLINEに貼る文をコピー：</p><div class="row">
    <button class="btn ghost sm" data-copy="ask">📣 ${a&&a.status==="tent"?"予告":"お知らせ"}</button>
    <button class="btn ghost sm" data-copy="remind">⏰ リマインド</button>
    <button class="btn ghost sm" data-copy="thanks">💐 お礼</button></div>
    <p class="small" style="margin:8px 0 0">文の最後にアプリのリンクが自動で付きます。</p></div>`;
  return h;
}
function lineText(kind){
  const a=nextAct()||S.acts[S.acts.length-1];const url="（アプリのリンク）";
  if(kind==="ask"&&a.status==="tent")return `【栽培ボランティア🌼予告】\n${when(a)}に「${a.name}」を予定しています。\n日程が決まりましたら、改めてお知らせします。\n${url}`;
  if(kind==="ask")return `【栽培ボランティア🌼お知らせ】\n「${a.name}」を行います。\n${a.cands?"候補日："+a.cands.map(c=>fd(c)).join("、")+"\nアプリで○△×を入れてください。":"日程："+fd(a.date)}\n${url}`;
  if(kind==="remind")return `【リマインド⏰】\n${a.status==="conf"?"明日 "+fd(a.date)+" "+a.time:"もうすぐ"}「${a.name}」です。\n場所：${a.place}\nよろしくお願いします！\n${url}`;
  const done=[...S.acts].reverse().find(x=>x.status==="done");const nx=nextAct();
  return `【お礼💐】\n「${done.name}」にご参加いただき、ありがとうございました！\n写真はアプリのアルバムに載せています。\n${nx?"次回は"+md(nx.date)+"月ごろ「"+nx.name+"」の予定です。":""}\n${url}`;
}

/* ===== 年間 ===== */
function year(){
  let h=`<div class="card"><p class="sec">📅 2026年度の年間予定</p>`;
  S.acts.forEach(a=>{h+=`<div class="yr" data-open="${a.id}"><div class="mo">${md(a.date)}月<small>${a.status==="tent"||a.status==="plan"?"未定":fd(a.date,false)+(a.end?"〜"+fd(a.end,false):"")}</small></div><div class="ic">${a.icon}</div><div class="bd"><b>${a.name}</b>${stChip(a)}${a.status==="tent"?` <span class="small">${when(a)}</span>`:""}${a.status==="done"?(S.role==="leader"?`<span class="step" style="display:inline-flex;align-items:center;gap:6px;margin-left:6px"><button class="pm" data-attadj="${a.id}|-1">−</button><b style="font-size:14px;min-width:34px;text-align:center">${a.att}人</b><button class="pm" data-attadj="${a.id}|1">＋</button></span>`:` <span class="small">${a.att}人参加</span>`):""}</div></div>`});
  if(S.role==="leader")h+=`<p class="small" style="margin:10px 0 0">💡 アプリを使い始める前の作業は、参加人数を「−」「＋」でだいたいの数に合わせてください。その人数分の花が、最初から花壇に咲いた状態になります。アプリを使い始めてからは、当日の「花を植える」で自動的に数えられます。</p>`;
  h+=`</div>`;
  if(S.role==="leader"){
    h+=`<div class="card"><p class="sec">🔁 来年度の予定をつくる</p><p class="small" style="margin-top:0">今年度と同じ作業を、来年度の「予告」としてだいたいの時期（上旬・中旬・下旬）で並べます。日にちは書かず、日程調整を始めるときに候補日を入れます。</p>
    <button class="btn" id="mkNext">2027年度の予定を作成</button>${S.nextYear?`<div style="margin-top:12px">${S.nextYear.map(x=>`<div class="yr"><div class="mo">${md(x.date)}月<small>未定</small></div><div class="ic">${x.icon}</div><div class="bd"><b>${x.name}</b><span class="chip st-tent">予告</span> <span class="small">${when(x)}</span></div></div>`).join("")}</div>`:""}</div>`;
  }
  return h;
}
function shiftYear(s){const d=new Date(s+"T00:00:00");const wd=d.getDay();const n=new Date(d);n.setFullYear(d.getFullYear()+1);let best=n,bd=9;for(let k=-3;k<=3;k++){const t=new Date(n);t.setDate(n.getDate()+k);if(t.getDay()===wd&&Math.abs(k)<bd){best=t;bd=Math.abs(k)}}return best.getFullYear()+"-"+String(best.getMonth()+1).padStart(2,"0")+"-"+String(best.getDate()).padStart(2,"0")}

/* ===== アルバム ===== */
function photosOf(a){return (S.photos[a.id]||[])}
function phTiles(a,withAdd){
  const real=photosOf(a).map(u=>`<div class="ph" style="background-image:url(${u})"></div>`).join("");
  const sample=a.status==="done"?Array.from({length:3},(_,i)=>`<div class="ph" style="background:${PH_BG[(i+a.id.charCodeAt(1))%4]}">${i===0?a.icon:i===1?"🧤":"😊"}</div>`).join(""):"";
  return `<div class="album">${real}${sample}${withAdd?`<div class="ph add" data-addph="${a.id}">＋<br><span style="font-size:10px">写真</span></div>`:""}</div>`;
}
function album(){
  let h="";const done=S.acts.filter(a=>a.status==="done").reverse();
  done.forEach(a=>{h+=`<div class="card"><p class="sec">${a.icon} ${a.name} <span class="small" style="font-weight:400">${fd(a.date,false)}</span></p>${phTiles(a,true)}</div>`});
  return h+`<p class="small" style="text-align:center">※ 色付きの四角は写真の見本です。「＋」から実際の写真を追加できます。<br>子どもの顔が写った写真は載せない約束にしておくと安心です。</p>`;
}

/* ===== 詳細シート ===== */
function openAct(id){
  const a=S.acts.find(x=>x.id===id);let h=`<button class="close" id="cls">✕</button><div style="font-size:46px">${a.icon}</div><h2 style="margin:6px 0">${a.name}</h2>${stChip(a)}
  <div class="card" style="margin-top:12px"><div class="small" style="color:var(--ink);line-height:1.9">📅 ${a.status==="tent"?when(a)+"（日程は未定）":a.status==="plan"?"日程調整中":fd(a.date)+(a.end?"〜"+fd(a.end):"")}<br>${a.status==="tent"||a.status==="plan"?"":"⏰ "+a.time+"<br>"}📍 ${a.place}<br>🧤 道具は学校にそろっています（持ち物なし）</div><p style="font-size:14px;line-height:1.8;margin:10px 0 0">${a.desc}</p></div>`;
  if(S.role==="leader"&&a.status==="tent")h+=`<div class="card" style="border:2px solid #FFE3A3"><p class="sec">🧑‍🌾 代表のメニュー</p>${tentLeader(a)}</div>`;
  if(a.duty){
    h+=`<div class="card"><p class="sec">💧 水やり当番表</p><p class="small" style="margin-top:0">都合のよい日をタップすると、当番に入れます（もう一度タップで取り消し）。</p><div class="duty">`;
    const s=new Date(a.date+"T00:00:00"),e=new Date(a.end+"T00:00:00");
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const k=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const who=a.roster[k]||[];
      h+=`<button class="dy ${who.includes(ME)?"me":who.length?"full":""}" data-duty="${a.id}|${k}"><b>${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）</b><div class="who">${who.length?"💧"+who.join("・"):"募集中"}</div></button>`}
    h+=`</div></div>`;
  }
  if(a.status==="done"){
    h+=`<div class="card"><p class="sec">💐 代表からのお礼</p><p style="font-size:14px;line-height:1.8;margin:0">${a.thanks}</p><p class="small" style="margin:8px 0 0">参加：${a.att}人</p></div>
    <div class="card"><p class="sec">📷 写真</p>${phTiles(a,true)}</div>`;
  }
  $("sheet").innerHTML=h;$("modal").classList.remove("hidden");
  $("cls").onclick=()=>$("modal").classList.add("hidden");
}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.add("hidden")};

/* ===== 描画とイベント ===== */
function render(){
  $("main").innerHTML=S.view==="home"?home():S.view==="year"?year():album();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  document.querySelectorAll(".role button").forEach(b=>b.classList.toggle("on",b.dataset.r===S.role));
  save();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-vote],[data-open],[data-fix],[data-copy],[data-join],[data-duty],[data-addph],[data-startplan],[data-setfixed],[data-dayon],[data-checkin],[data-attfix],[data-attadj],#mkNext");if(!t)return;
  if(t.dataset.startplan){startPlan(t.dataset.startplan);return}
  if(t.dataset.setfixed){setFixed(t.dataset.setfixed);return}
  if(t.dataset.attadj){const[id,d]=t.dataset.attadj.split("|");const a=S.acts.find(x=>x.id===id);a.att=Math.max(0,(a.att||0)+(+d));render();return}
  if(t.dataset.dayon){const a=S.acts.find(x=>x.id===t.dataset.dayon);a.dayMode=true;a.join=a.join||[];
    // 試作版：参加予定の人のうち何人かは、もう花を植えた状態にしておく
    a.checkin=a.join.filter(m=>m!==ME).slice(0,Math.max(1,a.join.length-2));render();return}
  if(t.dataset.checkin){const a=S.acts.find(x=>x.id===t.dataset.checkin);a.checkin=a.checkin||[];
    if(a.checkin.includes(ME))a.checkin=a.checkin.filter(m=>m!==ME);
    else{a.checkin.push(ME);a.join=a.join||[];if(!a.join.includes(ME))a.join.push(ME);S.justBloom=true;toast("🌷","花を植えました！")}
    render();if(S.justBloom)setTimeout(()=>$("garden")&&$("garden").scrollIntoView({behavior:"smooth",block:"center"}),300);return}
  if(t.dataset.attfix){const a=S.acts.find(x=>x.id===t.dataset.attfix);const ck=[...document.querySelectorAll("#attList input:checked")].map(x=>x.value);
    a.checkin=ck;a.att=ck.length;a.status="done";a.thanks=a.thanks||"ご参加ありがとうございました！写真はアルバムに入れてください📷";toast("💐",ck.length+"人の参加で確定しました");render();return}
  if(t.dataset.vote){const[id,c,k]=t.dataset.vote.split("|");const a=S.acts.find(x=>x.id===id);a.votes[ME]=a.votes[ME]||{};const was=a.votes[ME][c];a.votes[ME][c]=k;
    const before=Object.entries(a.votes[ME]).some(([d,x])=>d!==c&&x==="o")||was==="o";
    if(k==="o"&&!before){S.justPlanted=true;toast("🌱","花壇に芽が出ました")}
    render();if(S.justPlanted)setTimeout(()=>$("garden")&&$("garden").scrollIntoView({behavior:"smooth",block:"center"}),300)}
  else if(t.dataset.open)openAct(t.dataset.open);
  else if(t.dataset.fix){const[id,c]=t.dataset.fix.split("|");const a=S.acts.find(x=>x.id===id);a.date=c;a.status="conf";a.join=Object.entries(a.votes).filter(([m,v])=>v[c]==="o").map(([m])=>m);toast("📌",fd(c)+"に決定しました");render()}
  else if(t.dataset.join){const a=S.acts.find(x=>x.id===t.dataset.join);a.join=a.join||[];if(a.join.includes(ME)){a.join=a.join.filter(m=>m!==ME)}else{a.join.push(ME);S.justPlanted=true;toast("🌱","参加の連絡をしました")}render()}
  else if(t.dataset.copy){const txt=lineText(t.dataset.copy);const done=()=>toast("📋","コピーしました。LINEに貼り付けてください");
    try{navigator.clipboard.writeText(txt).then(done,()=>showText(txt))}catch(err){showText(txt)}}
  else if(t.dataset.duty){const[id,k]=t.dataset.duty.split("|");const a=S.acts.find(x=>x.id===id);const w=a.roster[k]=a.roster[k]||[];
    if(w.includes(ME))a.roster[k]=w.filter(m=>m!==ME);else{w.push(ME);toast("💧","当番に入りました")}save();openAct(id)}
  else if(t.dataset.addph){S.addTo=t.dataset.addph;$("file").click()}
  else if(t.id==="mkNext"){S.nextYear=S.acts.map(a=>({icon:a.icon,name:a.name,date:shiftYear(a.date),when:a.when}));toast("🔁","来年度の予定をつくりました");render()}
});
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function startPlan(id){
  const a=S.acts.find(x=>x.id===id);
  const inp=v=>`<input type="date" class="cd" value="${v}" style="width:100%;font-family:inherit;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px">`;
  $("sheet").innerHTML=`<button class="close" id="cls">✕</button><p class="sec">🗓 日程調整を始める</p><p class="small">${a.icon} ${a.name}（${when(a)}）<br>候補日を入れてください。</p><div id="cds">${[-1,0,1].map(k=>inp(addDays(a.date,k))).join("")}</div>
  <button class="btn ghost sm" id="addCd">＋ 候補日を追加</button><div style="height:14px"></div><button class="btn" id="goPlan">この候補日で始める</button>
  <p class="small">始めると、メンバーの画面に候補日と○△×が表示されます。</p>`;
  $("modal").classList.remove("hidden");$("cls").onclick=()=>$("modal").classList.add("hidden");
  $("addCd").onclick=()=>$("cds").insertAdjacentHTML("beforeend",inp(""));
  $("goPlan").onclick=()=>{const c=[...document.querySelectorAll(".cd")].map(x=>x.value).filter(Boolean).sort();if(!c.length)return;
    a.cands=[...new Set(c)];a.votes={};a.status="plan";
    // 試作版：ほかのメンバーの回答を仮に入れておく
    MEMBERS.slice(1,6).forEach((m,i)=>{a.votes[m]={};a.cands.forEach((d,j)=>a.votes[m][d]="oxt"[(i+j*2)%3])});$("modal").classList.add("hidden");toast("🗓","日程調整を始めました");render()};
}
function setFixed(id){
  const a=S.acts.find(x=>x.id===id);
  $("sheet").innerHTML=`<button class="close" id="cls">✕</button><p class="sec">📌 日にちを決めて告知する</p><p class="small">${a.icon} ${a.name}<br>${a.when}の日にちと時間を入れてください。</p>
  <input type="date" id="fxd" value="${a.date}" style="width:100%;font-family:inherit;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px">
  <input type="text" id="fxt" value="${a.time}" style="width:100%;font-family:inherit;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px">
  <button class="btn" id="goFix">この日で告知する</button><p class="small">メンバーの画面に日にちが表示され、「参加します」で参加の連絡ができるようになります。</p>`;
  $("modal").classList.remove("hidden");$("cls").onclick=()=>$("modal").classList.add("hidden");
  $("goFix").onclick=()=>{if(!$("fxd").value)return;a.date=$("fxd").value;a.time=$("fxt").value||a.time;a.status="conf";a.join=[];$("modal").classList.add("hidden");toast("📌",fd(a.date)+"で告知しました");render()};
}
function showText(txt){$("sheet").innerHTML=`<button class="close" id="cls">✕</button><p class="sec">LINEに貼る文</p><p class="small">下の文を長押ししてコピーしてください。</p><textarea rows="8">${txt}</textarea>`;$("modal").classList.remove("hidden");$("cls").onclick=()=>$("modal").classList.add("hidden")}
$("file").onchange=e=>{const id=S.addTo;S.photos[id]=S.photos[id]||[];[...e.target.files].forEach(f=>S.photos[id].unshift(URL.createObjectURL(f)));e.target.value="";toast("📷","写真を追加しました");
  if(!$("modal").classList.contains("hidden"))openAct(id);render()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();window.scrollTo(0,0)});
document.querySelectorAll(".role button").forEach(b=>b.onclick=()=>{S.role=b.dataset.r;render()});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
